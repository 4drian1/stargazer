<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Stargazer 信息面板（SHADOW）</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #101418; color: #d7dce2; }
  header { background: #171c22; padding: 10px 16px; display: flex; gap: 12px; align-items: center;
           border-bottom: 1px solid #2a313a; position: sticky; top: 0; }
  header h1 { font-size: 15px; margin: 0; color: #e8b339; }
  header .meta { font-size: 12px; color: #8a939e; }
  button { background: #23527c; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px;
           cursor: pointer; font-size: 13px; }
  button:hover { background: #2e6da4; }
  main { padding: 14px 16px; max-width: 1200px; margin: 0 auto; }
  section { background: #171c22; border: 1px solid #2a313a; border-radius: 6px;
            padding: 12px 14px; margin-bottom: 14px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: #7fb3e0; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
  .tag.facts { background: #3a3f46; color: #b8c0ca; }
  .tag.rule { background: #4a3b1e; color: #e8b339; }
  .tag.model { background: #1e3d2f; color: #6fd39a; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #232a32; }
  th { color: #8a939e; font-weight: normal; font-size: 12px; }
  .up { color: #ef5350; } .down { color: #26a69a; } .flat { color: #8a939e; }
  .card { display: inline-block; background: #1d232b; border: 1px solid #2a313a; border-radius: 6px;
          padding: 10px 16px; margin: 0 10px 10px 0; min-width: 150px; vertical-align: top; }
  .card .name { font-size: 12px; color: #8a939e; }
  .card .val { font-size: 20px; font-weight: bold; margin: 2px 0; }
  .card .sub { font-size: 11px; color: #6b747f; }
  .ev { font-size: 12px; background: #1d232b; border-left: 3px solid #3a4b5c; padding: 6px 8px;
        margin: 6px 0; }
  .ev .t { color: #a8c7e8; } .ev a { color: #5b8fc7; font-size: 11px; }
  .gap { color: #e8b339; font-size: 12px; }
  .notebox { width: 100%; min-height: 60px; background: #1d232b; color: #d7dce2;
             border: 1px solid #2a313a; border-radius: 4px; padding: 8px; font-size: 13px; }
  .rules { font-size: 11px; color: #8a939e; }
  .plan-miss { color: #b77; }
</style>
</head>
<body>
<header>
  <h1>Stargazer 信息面板 <span style="font-size:11px;color:#e8b339">SHADOW·不构成买卖建议</span>
    <a href="/" style="font-size:11px;color:#5b8fc7;margin-left:10px">← 返回主页</a></h1>
  <span class="meta" id="meta">加载中…</span>
  <button onclick="refresh()">手动刷新</button>
  <span class="meta" id="timer"></span>
</header>
<main>
  <section>
    <h2>计划股票<span class="tag facts">行情=事实</span><span class="tag rule">方向/先验=规则粗表</span><span class="tag model">p=materiality 正式分</span></h2>
    <div id="stocks"></div>
  </section>
  <section>
    <h2>相关板块（申万一级，实时）</h2>
    <div id="sectors"></div>
  </section>
  <section>
    <h2>资讯（板块政策/宏观商品）<span class="tag facts">快讯转述源·未经核实</span></h2>
    <div id="news"></div>
  </section>
  <section>
    <h2>隔夜外盘与大宗<span class="tag facts">纯事实·无模型覆盖</span></h2>
    <div id="macro"></div>
  </section>
  <section>
    <h2>问题记录（你在此留的问题会按快照时间落档，供后续调优）</h2>
    <textarea class="notebox" id="note" placeholder="例：某票出了减持公告但页面没标红 / 板块数据中午断了一次 / 这个 p 值看着不对…"></textarea>
    <button onclick="saveNote()">保存问题记录</button>
    <span class="meta" id="noteStatus"></span>
  </section>
  <section>
    <h2>数据缺口与来源</h2>
    <div id="gaps" class="gap"></div>
    <div class="rules" id="labels"></div>
  </section>
</main>
<script>
let AUTO_MIN = 30;
function cls(v){ return v==null ? 'flat' : (v>0?'up':(v<0?'down':'flat')); }
function sgn(v){ return v==null ? '—' : (v>0?'+':'') + v; }

async function load(){
  const meta = document.getElementById('meta');
  meta.textContent = '采集中（首次约 1–2 分钟，请稍候）…';
  meta.style.color = '#e8b339';
  let d;
  try {
    const r = await fetch('/api/info/snapshot');
    d = await r.json();
  } catch (e) {
    meta.textContent = '请求失败（服务未响应或正在采集）: ' + e;
    meta.style.color = '#ef5350';
    schedule();
    return;
  }
  meta.style.color = '';
  if (d.error){ meta.textContent = '采集错误: ' + d.error; meta.style.color = '#ef5350'; schedule(); return; }
  AUTO_MIN = d.auto_interval_min || 30;
  meta.textContent =
    `快照 ${d.snapshot_ts} ｜ 采集耗时 ${d.elapsed_s}s ｜ 计划交易日 ${d.plan.trading_date||'—'}（${d.plan.source||'无冻结计划'}）`;
  try {
    renderStocks(d.sections.stocks||[]);
  } catch (e) { document.getElementById('stocks').innerHTML = '<div class="gap">⚠ 计划股票渲染错误: '+e.message+'</div>'; }
  try {
    renderSectors(d.sections.sectors||[]);
  } catch (e) { document.getElementById('sectors').innerHTML = '<div class="gap">⚠ 板块渲染错误: '+e.message+'</div>'; }
  try {
    renderNews(d.sections.news||{});
  } catch (e) { document.getElementById('news').innerHTML = '<div class="gap">⚠ 资讯渲染错误: '+e.message+'</div>'; }
  try {
    renderMacro(d.sections.macro||{});
  } catch (e) { document.getElementById('macro').innerHTML = '<div class="gap">⚠ 外盘渲染错误: '+e.message+'</div>'; }
  document.getElementById('gaps').innerHTML = (d.gaps||[]).map(g=>'⚠ '+g).join('<br>') || '无';
  document.getElementById('labels').textContent = JSON.stringify(d.labels);
  schedule();
}
function renderStocks(rows){
  const el = document.getElementById('stocks');
  if (!rows.length){ el.innerHTML = '<span class="plan-miss">今日无冻结计划股票（frozen_*.json 缺失或已过期）</span>'; return; }
  el.innerHTML = rows.map(s=>{
    const q = s.quote||{};
    const evs = (s.events||[]).map(ev=>`
      <div class="ev">
        <span class="t">【${ev.tier}/${ev.category}】</span>${(ev.titles||[]).join('、')}
        ${ev.matched_keyword?` 关键词=<b>${ev.matched_keyword}</b>`:''}
        方向提示=<b>${ev.direction_hint}</b>（规则粗表）
        ${ev.category_prior?`<br>类目先验：${ev.category_prior}`:''}
        <br>p_materiality：<b>${ev.p_materiality??'—'}</b> <span class="rules">${ev.score_note}</span>
        ${ev.url?` <a href="${ev.url}" target="_blank">原文</a>`:''}
      </div>`).join('') || '<div class="ev rules">近 3 日无公告记录</div>';
    const rules = s.rules||{};
    const rtxt = Object.entries(rules).map(([k,v]) =>
      `${k}: ${v ? ((v.dsl||'—') + (v.desc ? `（${v.desc}）` : '')) : '—（无）'}`).join(' ｜ ');
    return `<div style="margin-bottom:14px">
      <b>${s.code} ${s.name}</b>
      现价 <b class="${cls(q.pct_chg)}">${q.price??'—'}</b>
      <span class="${cls(q.pct_chg)}">${sgn(q.pct_chg)}%</span>
      <span class="rules">${q.time||''} ${q.status!=='OK'?'('+q.status+')':''}</span>
      ｜ 板块：<b>${s.sector||'未知'}</b>
      ${s.sector_pct!=null?`<span class="${cls(s.sector_pct)}">${sgn(s.sector_pct)}%</span>`:''}
      ${s.rule_note?` ｜ <span style="color:#e8b339">${s.rule_note}</span>`:''}
      <div class="rules">${rtxt}</div>${evs}</div>`;
  }).join('');
}
function renderSectors(rows){
  document.getElementById('sectors').innerHTML = rows.length
    ? rows.map(s=>`<div class="card"><div class="name">${s.name}</div>
        <div class="val ${cls(s.pct_chg)}">${sgn(s.pct_chg)}%</div>
        <div class="sub">${(s.stocks||[]).join('、')}</div></div>`).join('')
    : '<span class="plan-miss">无板块数据</span>';
}
function renderNews(n){
  const fmtItem = x => `<div class="ev"><span class="rules">${x.time}</span>
    ${x.macro_tags&&x.macro_tags.length?`<span class="tag facts">${x.macro_tags.join(' ')}</span>`:''}
    ${x.sector_tags&&x.sector_tags.length?`<span class="tag rule">${x.sector_tags.join(' ')}</span>`:''}
    <br>${x.content}</div>`;
  let html = `<div class="rules">来源：${n.source||'—'}（机器转述，未经核实；打标=关键词规则匹配）</div>`;
  html += `<h2 style="font-size:12px;color:#8a939e;margin-top:10px">宏观/商品相关</h2>`;
  html += (n.macro||[]).length ? (n.macro||[]).map(fmtItem).join('')
                              : '<div class="ev rules">近批快讯无宏观/商品命中</div>';
  html += `<h2 style="font-size:12px;color:#8a939e;margin-top:10px">计划板块相关（政策/行业）</h2>`;
  if ((n.sector_related||[]).length){
    for (const g of n.sector_related){
      html += `<div style="margin:6px 0"><b style="color:#7fb3e0">${g.sector}</b>${g.items.map(fmtItem).join('')}</div>`;
    }
  } else {
    html += '<div class="ev rules">近批快讯无计划板块命中（缺口本身也是信息：可关注Corvus新闻采集线）</div>';
  }
  document.getElementById('news').innerHTML = html;
}
function renderMacro(m){
  const card = x=>`<div class="card"><div class="name">${x.name}</div>
    <div class="val ${cls(x.pct_chg)}">${x.close??'—'}</div>
    <div class="${cls(x.pct_chg)}">${sgn(x.pct_chg)}%</div>
    <div class="sub">${x.date||''} ${x.status!=='OK'?'('+x.status+')':''}</div></div>`;
  document.getElementById('macro').innerHTML =
    `<h2 style="font-size:12px;color:#8a939e">美股（隔夜收盘）</h2>` +
    (m.us||[]).map(card).join('') +
    `<h2 style="font-size:12px;color:#8a939e">大宗</h2>` +
    (m.commodities||[]).map(card).join('') +
    `<div class="rules" style="margin-top:6px">${m.label||''}</div>`;
}
async function refresh(){
  document.getElementById('meta').textContent = '采集中…';
  const r = await fetch('/api/info/refresh', {method:'POST'}); const d = await r.json();
  if (d.error){ document.getElementById('meta').textContent='采集错误: '+d.error; return; }
  await load();
}
async function saveNote(){
  const t = document.getElementById('note').value.trim();
  if (!t) return;
  const r = await fetch('/api/info/note', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({text:t})});
  const d = await r.json();
  document.getElementById('noteStatus').textContent = d.saved ? ('已保存 → ' + d.saved) : ('失败: '+d.error);
  if (d.saved) document.getElementById('note').value = '';
}
let hnd = null;
function schedule(){
  clearTimeout(hnd);
  let left = AUTO_MIN*60;
  hnd = setInterval(()=>{ left-=1;
    document.getElementById('timer').textContent = `自动刷新 ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
    if (left<=0){ clearInterval(hnd); load(); } }, 1000);
}
load();
</script>
</body>
</html>
