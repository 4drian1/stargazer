# feature_registry v2 (Gate 2 canonical, machine-readable)
# Feature Builder / 训练 / 实时推理 / Ablation 共用唯一字段合同。
# 未注册字段禁止进入 Model Matrix。
#
# Gate 1 分诊 (2026-09-17 裁决):
#   gate1_phase:
#     CORE              -> Gate 1A, Step 9A 核心入场重建 (A0-A4)，补完数据 QA 后启动
#     CONTEXT_BLOCKED   -> Gate 1B, 需 PIT Sector；在解决前 DISABLED_UNTIL_PIT_SECTOR
#     OPTIONAL_DISABLED-> Gate 1C, 真实 VP/POC/VAL，待质量确认后单独开启
#
# origin ∈ {RAW, CONTINUOUS_DERIVED, INTERACTION, CONTEXT, PROXY, RULE_FLAG, RULE_AGGREGATE, METADATA}
# a7_policy / a7b_policy ∈ {KEEP, DROP}
# availability_stage ∈ {P_CLOSE, D_INTRADAY, PLANNED}
# latest_source_timestamp_rule: 特征数据最晚可见时点相对于 as_of 的约束

features:
  # ---------- METADATA (never enters model) ----------
  - {feature_name: symbol, feature_group: meta, origin: METADATA, model_scope: NONE, availability_stage: NA, source_table: raw, formula_version: 1, point_in_time_rule: "always", missing_policy: "error", a7_policy: DROP, a7b_policy: DROP, model_eligible: false, dtype: str, unit: "-", latest_source_timestamp_rule: "na", gate1_phase: CORE, description: "股票代码，仅索引"}
  - {feature_name: snapshot_time, feature_group: meta, origin: METADATA, model_scope: NONE, availability_stage: NA, source_table: raw, formula_version: 1, point_in_time_rule: "always", missing_policy: "error", a7_policy: DROP, a7b_policy: DROP, model_eligible: false, dtype: int, unit: "YYYYMMDDHHMMSS", latest_source_timestamp_rule: "na", gate1_phase: CORE, description: "盘中快照时刻"}
  - {feature_name: trade_date, feature_group: meta, origin: METADATA, model_scope: NONE, availability_stage: NA, source_table: raw, formula_version: 1, point_in_time_rule: "always", missing_policy: "error", a7_policy: DROP, a7b_policy: DROP, model_eligible: false, dtype: int, unit: "YYYYMMDD", latest_source_timestamp_rule: "na", gate1_phase: CORE, description: "事件/标签日 D"}

  # ---------- CONTEXT (setup; A7 keep, A7b drop) ----------
  - {feature_name: setup_type, feature_group: setup, origin: CONTEXT, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: DROP, model_eligible: true, dtype: str, unit: "BOTTOM_SETUP|INTRADAY_DIP_SETUP", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "双Setup类型，统一模型必含"}
  - {feature_name: bottom_subtype, feature_group: setup, origin: CONTEXT, model_scope: S0, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: DROP, model_eligible: true, dtype: str, unit: "-", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "底部子类型"}

  # ---------- RULE_FLAG / RULE_AGGREGATE (A7 drop) ----------
  - {feature_name: bottom_score, feature_group: rule, origin: RULE_AGGREGATE, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: float, unit: "score", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "规则综合分，仅上下文/对照，不得当标签"}
  - {feature_name: intraday_dip_score, feature_group: rule, origin: RULE_AGGREGATE, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: float, unit: "score", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "盘中下杀分，仅上下文/对照"}
  - {feature_name: is_pullback_bottom, feature_group: rule, origin: RULE_FLAG, model_scope: S0, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: int, unit: "0/1", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "规则标志"}
  - {feature_name: structure_broken, feature_group: rule, origin: RULE_FLAG, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: int, unit: "0/1", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "结构破坏标志"}
  - {feature_name: armed_bottom, feature_group: rule, origin: RULE_FLAG, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: int, unit: "0/1", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "底部armed标志"}
  - {feature_name: watch_priority, feature_group: rule, origin: RULE_AGGREGATE, model_scope: S0, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: int, unit: "0/1/2", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "观察优先级"}
  # 以下两项依赖 Sector/Leader -> Gate 1B, DISABLED_UNTIL_PIT_SECTOR
  - {feature_name: leader_weakening_flag, feature_group: rule, origin: RULE_FLAG, model_scope: S0, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE (需 LeaderSet)", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: int, unit: "0/1", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CONTEXT_BLOCKED, description: "龙头走弱标志 (需 PIT Leader)"}
  - {feature_name: sector_synchronous_weakening, feature_group: rule, origin: RULE_FLAG, model_scope: S0, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE (需 Sector)", missing_policy: "zero", a7_policy: DROP, a7b_policy: DROP, model_eligible: true, dtype: int, unit: "0/1", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CONTEXT_BLOCKED, description: "板块同步走弱标志 (需 PIT Sector)"}

  # ---------- RAW ----------
  - {feature_name: open, feature_group: price, origin: RAW, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "开盘价"}
  - {feature_name: high, feature_group: price, origin: RAW, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "最高价"}
  - {feature_name: low, feature_group: price, origin: RAW, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "最低价"}
  - {feature_name: close, feature_group: price, origin: RAW, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "收盘价"}
  # EXECUTION PRICE (raw) vs ANALYTIC PRICE (PIT-safe continuous) 拆分 (Gate 1A-R4)
  - {feature_name: vendor_pre_close, feature_group: price, origin: RAW, model_scope: NONE, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: DROP, a7b_policy: DROP, model_eligible: false, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "供应商 pre_close; 老历史质量差(全历史仅~57.5%可靠), 禁止进入模型; 分析口径改用 analytic_prev_close"}
  - {feature_name: analytic_adjusted_close, feature_group: price, origin: CONTINUOUS_DERIVED, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: canonical_adj_chain, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE (PIT: effective_date<=asof)", gate1_phase: CORE, description: "PIT-safe 连续复权收盘价 (anchor_chain_mult, 不用存储 cum)"}
  - {feature_name: analytic_prev_close, feature_group: price, origin: CONTINUOUS_DERIVED, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: canonical_adj_chain, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE (PIT: effective_date<=asof)", gate1_phase: CORE, description: "上一合法交易日 canonical adjusted close; 替代 vendor pre_close, 避免除权日假低开"}
  - {feature_name: volume, feature_group: price, origin: RAW, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "股", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "成交量"}

  # ---------- CONTINUOUS_DERIVED (S0 / P_CLOSE) ----------
  - {feature_name: atr_ref, feature_group: vol, origin: CONTINUOUS_DERIVED, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE (median ATR14[T-4..T])", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "入场前5日ATR14中位数，P日冻结"}
  - {feature_name: ma20, feature_group: trend, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "元", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "20日均线"}
  - {feature_name: ma20_slope_5, feature_group: trend, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "MA20 5日斜率"}
  - {feature_name: dist_low20_60, feature_group: position, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ATR", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "距20/60日低点"}
  - {feature_name: zone_distance_atr, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ATR", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "距流动性密集区中心(ATR)"}
  - {feature_name: recovery_atr, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ATR", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "自区间低点的修复(ATR)"}
  - {feature_name: recovery_from_zone_low_atr, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: S0_TIMING, availability_stage: P_CLOSE, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE, 仅ZONE_TOUCH后", missing_policy: "nan+zone_touch_missing=1", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ATR", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "(CurrentPrice-ZoneTouchLow)/ATR_ref"}
  - {feature_name: turnover_ratio_20d, feature_group: activity, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "当日换手/20日中位换手(S0静态)"}
  - {feature_name: volume_ratio_20d, feature_group: activity, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: raw, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "当日量/20日中位量(S0静态)"}

  # ---------- F9-S0 (P日冻结) ----------
  # market_ret 改用 MARKET_PROXY-V1 (缺失指数时自建, 不依赖 Sector)
  - {feature_name: market_ret_5d, feature_group: f9_s0, origin: PROXY, model_scope: S0, availability_stage: P_CLOSE, source_table: proxy_market, formula_version: 1, point_in_time_rule: "P_CLOSE (MARKET_PROXY-V1)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "市场5日收益(缺失指数, 由 MARKET_PROXY-V1 equal/float 加权, leave-one-out 替代)"}
  - {feature_name: market_ret_20d, feature_group: f9_s0, origin: PROXY, model_scope: S0, availability_stage: P_CLOSE, source_table: proxy_market, formula_version: 1, point_in_time_rule: "P_CLOSE (MARKET_PROXY-V1)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "市场20日收益(同上, MARKET_PROXY-V1)"}
  # 以下 Sector/Leader 特征 -> Gate 1B, DISABLED_UNTIL_PIT_SECTOR
  - {feature_name: sector_ret_5d, feature_group: f9_s0, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: sector, formula_version: 1, point_in_time_rule: "P_CLOSE (需 PIT Sector)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CONTEXT_BLOCKED, description: "板块5日收益(需 PIT Sector, 禁用 current mapping backfill)"}
  - {feature_name: sector_vs_market_5d, feature_group: f9_s0, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: sector, formula_version: 1, point_in_time_rule: "P_CLOSE (需 PIT Sector)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CONTEXT_BLOCKED, description: "板块相对市场5日(需 PIT Sector)"}
  - {feature_name: leader_return_5d, feature_group: f9_s0, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: leader, formula_version: 1, point_in_time_rule: "P_CLOSE (冻结LeaderSet)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CONTEXT_BLOCKED, description: "龙头5日历史表现(需 PIT Leader)"}
  - {feature_name: sector_breadth_20d, feature_group: f9_s0, origin: CONTINUOUS_DERIVED, model_scope: S0, availability_stage: P_CLOSE, source_table: sector, formula_version: 1, point_in_time_rule: "P_CLOSE (需 PIT Sector)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CONTEXT_BLOCKED, description: "板块宽度20日(需 PIT Sector)"}

  # ---------- F9-TIMING (D日盘中) ----------
  - {feature_name: leader_return_intraday, feature_group: f9_timing, origin: CONTINUOUS_DERIVED, model_scope: TIMING, availability_stage: D_INTRADAY, source_table: leader, formula_version: 1, point_in_time_rule: "Open_D -> snapshot (需 PIT Leader)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= snapshot_time", gate1_phase: CONTEXT_BLOCKED, description: "龙头日内收益(需 PIT Leader)"}
  - {feature_name: sector_ret_intraday, feature_group: f9_timing, origin: CONTINUOUS_DERIVED, model_scope: TIMING, availability_stage: D_INTRADAY, source_table: sector, formula_version: 1, point_in_time_rule: "Open_D -> snapshot (需 PIT Sector)", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= snapshot_time", gate1_phase: CONTEXT_BLOCKED, description: "板块日内收益(需 PIT Sector)"}

  # ---------- F10 盘中同时间 (D_INTRADAY) ----------
  - {feature_name: cum_turnover_vs_hist_same_time, feature_group: f10, origin: CONTINUOUS_DERIVED, model_scope: TIMING, availability_stage: D_INTRADAY, source_table: raw, formula_version: 1, point_in_time_rule: "Open_D -> snapshot", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= snapshot_time", gate1_phase: CORE, description: "D日累计换手/过去60日同minute-of-day中位"}
  - {feature_name: cum_volume_vs_hist_same_time, feature_group: f10, origin: CONTINUOUS_DERIVED, model_scope: TIMING, availability_stage: D_INTRADAY, source_table: raw, formula_version: 1, point_in_time_rule: "Open_D -> snapshot", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ratio", latest_source_timestamp_rule: "<= snapshot_time", gate1_phase: CORE, description: "D日累计量/过去60日同minute-of-day中位"}

  # ---------- LATR 融合组 (PLANNED, Step 9.2 L2-L6) ----------
  - {feature_name: latr_zone, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: S0_TIMING, availability_stage: PLANNED, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "zone_id", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "流动性密集区ID(待建)"}
  - {feature_name: zone_strength, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: S0_TIMING, availability_stage: PLANNED, source_table: green_watch, formula_version: 1, point_in_time_rule: "P_CLOSE", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "score", latest_source_timestamp_rule: "<= P_CLOSE", gate1_phase: CORE, description: "区间聚类强度(待建)"}
  - {feature_name: opendip_atr, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: TIMING, availability_stage: PLANNED, source_table: minute, formula_version: 1, point_in_time_rule: "Open_D -> snapshot", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ATR", latest_source_timestamp_rule: "<= snapshot_time", gate1_phase: CORE, description: "开盘下杀深度(待建)"}
  - {feature_name: gap_atr, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: TIMING, availability_stage: PLANNED, source_table: minute, formula_version: 1, point_in_time_rule: "Open_D -> snapshot", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ATR", latest_source_timestamp_rule: "<= snapshot_time", gate1_phase: CORE, description: "跳空幅度(待建)"}
  - {feature_name: penetration_atr, feature_group: latr, origin: CONTINUOUS_DERIVED, model_scope: TIMING, availability_stage: PLANNED, source_table: minute, formula_version: 1, point_in_time_rule: "Open_D -> snapshot", missing_policy: "error", a7_policy: KEEP, a7b_policy: KEEP, model_eligible: true, dtype: float, unit: "ATR", latest_source_timestamp_rule: "<= snapshot_time", gate1_phase: CORE, description: "(ZoneLower-CurrentPrice)/ATR_ref(待建)"}
